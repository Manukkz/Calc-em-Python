<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyCalc Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)'], ['\\[', '\\]']] }, svg: { fontCache: 'global' } };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body, .card, .offcanvas { transition: background-color .3s ease; }
    .result-box {
      background-color: rgba(var(--bs-primary-rgb), 0.1);
      border: 2px solid rgba(var(--bs-primary-rgb), 0.2);
      border-radius: 1rem; padding: 2rem; position: relative;
    }
    .result-value { font-size: 2rem; font-weight: 700; color: var(--bs-primary); }
    [data-bs-theme="dark"] .mjx-chtml { color: #e0e0e0 !important; }
    
    /* Botões do Teclado */
    .keypad-btn { min-width: 45px; }
    
    /* Menu de Ajuda */
    .syntax-card { font-size: 0.9rem; background-color: var(--bs-body-bg); }
    code { color: var(--bs-primary); font-weight: bold; }
  </style>
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
  
  <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm mb-5">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary"><i class="fas fa-cube me-2"></i>PyCalc Pro</a>
      
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-primary btn-sm rounded-pill px-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasHistory">
            <i class="fas fa-history me-1"></i> Ver Histórico
        </button>
        <button class="btn btn-outline-secondary btn-sm rounded-circle border-0" onclick="toggleTheme()" id="themeBtn">
            <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow p-4 mb-5 border-0 rounded-4">
          <div class="text-center mb-4">
            <h4 class="fw-bold">Calculadora Simbólica</h4>
          </div>

          <div class="form-floating mb-3">
            <select id="operacao" class="form-select text-primary fw-bold" onchange="toggleInputs()">
              <option value="derivada">⚡ Derivada</option>
              <option value="integral">∫ Integral</option>
              <option value="limite">→ Limite</option>
            </select>
            <label>Operação</label>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-1 px-1">
             <label class="fw-bold text-muted small">FUNÇÃO f(x)</label>
             <button class="btn btn-sm text-primary p-0 border-0" type="button" data-bs-toggle="collapse" data-bs-target="#syntaxHelp" aria-expanded="false">
                <i class="far fa-question-circle me-1"></i>Como digitar?
             </button>
          </div>

          <div class="collapse mb-3" id="syntaxHelp">
            <div class="card card-body syntax-card border shadow-sm p-3">
                <div class="row g-2">
                    <div class="col-6">Potência: <code>x**2</code> <span class="text-muted">(x²)</span></div>
                    <div class="col-6">Raiz: <code>sqrt(x)</code> <span class="text-muted">(√x)</span></div>
                    <div class="col-6">Seno: <code>sin(x)</code></div>
                    <div class="col-6">Cosseno: <code>cos(x)</code></div>
                    <div class="col-6">Log (Natural): <code>log(x)</code></div>
                    <div class="col-6">Euler: <code>exp(x)</code> <span class="text-muted">(eˣ)</span></div>
                    <div class="col-6">Pi: <code>pi</code> <span class="text-muted">(π)</span></div>
                    <div class="col-6">Infinito: <code>oo</code> <span class="text-muted">(∞)</span></div>
                </div>
                <div class="mt-2 text-muted small fst-italic border-top pt-2">
                    *Use parênteses para agrupar: <code>(x+1)/(x-1)</code>
                </div>
            </div>
          </div>

          <div class="mb-2">
            <input id="funcao" class="form-control text-center fw-bold fs-5" placeholder="Ex: (x**2-1)/(x+1)" autocomplete="off">
          </div>

          <div class="d-flex gap-1 flex-wrap justify-content-center mb-3">
            <button onclick="addSym('x')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">x</button>
            <button onclick="addSym('**2')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn" title="Ao Quadrado">x²</button>
            <button onclick="addSym('**')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn" title="Potência">^</button>
            <button onclick="addSym('sqrt(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">√</button>
            <button onclick="addSym('sin(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">sin</button>
            <button onclick="addSym('cos(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">cos</button>
            <button onclick="addSym('tan(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">tan</button>
            <button onclick="addSym('log(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">ln</button>
            <button onclick="addSym('exp(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">eˣ</button>
            <button onclick="addSym('pi')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">π</button>
            <button onclick="addSym('oo')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">∞</button>
            <button onclick="addSym('(')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">(</button>
            <button onclick="addSym(')')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">)</button>
            <button onclick="addSym('/')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">÷</button>
            <button onclick="addSym('+')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">+</button>
            <button onclick="addSym('-')" class="btn btn-outline-secondary btn-sm fw-bold keypad-btn">-</button>
            <button onclick="limparInput()" class="btn btn-outline-danger btn-sm fw-bold keypad-btn" title="Limpar"><i class="fas fa-backspace"></i></button>
          </div>

          <div id="ponto-group" class="mb-3 d-none grp">
            <input id="ponto" class="form-control text-center" placeholder="X tende a (Ex: 0, oo)">
          </div>

          <div id="group-integral" class="row g-2 mb-3 d-none grp">
            <div class="col-6"><input id="int-a" class="form-control text-center" placeholder="De"></div>
            <div class="col-6"><input id="int-b" class="form-control text-center" placeholder="Até"></div>
          </div>

          <button onclick="calcular()" class="btn btn-primary w-100 rounded-pill fw-bold py-3 shadow-sm">
            <span id="btn-text">Calcular</span>
            <span id="loading" class="spinner-border spinner-border-sm ms-2" style="display:none"></span>
          </button>
        </div>

        <div id="result-area" style="display:none;" class="text-center mb-5">
          <div class="result-box shadow-sm mb-3">
            <div id="resultado" class="result-value"></div>
          </div>
          <button class="btn btn-outline-primary rounded-pill px-4" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSteps">Passo a Passo</button>
          <button id="btn-graph" class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#graphModal" style="display:none;">Gráfico</button>
        </div>
      </div>
    </div>
  </div>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasHistory">
    <div class="offcanvas-header">
        <h5 class="fw-bold text-primary"><i class="fas fa-history me-2"></i>Histórico</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <button onclick="limparHistorico()" class="btn btn-outline-danger w-100 mb-3 btn-sm">Limpar Tudo</button>
        <div id="history-list" class="list-group list-group-flush"></div>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasSteps">
    <div class="offcanvas-header"><h5 class="fw-bold">Explicação</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body"><div class="accordion accordion-flush" id="accordionSteps"></div></div>
  </div>

  <div class="modal fade" id="graphModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content"><div class="modal-body text-center p-4"><img id="modal-graph-img" class="img-fluid rounded"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
    const API_URL = "https://calc-em-python.onrender.com/calculate"; 

    // TEMA
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-bs-theme', savedTheme);

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-bs-theme");
      const newTheme = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-bs-theme", newTheme);
      localStorage.setItem('theme', newTheme);
    }
    
    function toggleInputs() {
      const op = document.getElementById("operacao").value;
      document.querySelectorAll('.grp').forEach(el => el.classList.add('d-none'));
      if (op === 'limite') document.getElementById('ponto-group').classList.remove('d-none');
      if (op === 'integral') document.getElementById('group-integral').classList.remove('d-none');
    }
    toggleInputs();

    function addSym(symbol) {
        const input = document.getElementById("funcao");
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const text = input.value;
        const before = text.substring(0, start);
        const after = text.substring(end, text.length);
        input.value = before + symbol + after;
        input.focus();
        const newPos = start + symbol.length;
        input.setSelectionRange(newPos, newPos);
    }
    function limparInput() {
        const input = document.getElementById("funcao");
        input.value = "";
        input.focus();
    }

    async function calcular() {
      const func = document.getElementById("funcao").value.trim();
      const op = document.getElementById("operacao").value;
      const pt = document.getElementById("ponto").value;
      const a = document.getElementById("int-a").value;
      const b = document.getElementById("int-b").value;
      
      if (!func) { alert("Digite uma função."); return; }

      document.getElementById("loading").style.display = "inline-block"; 
      
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ func_str: func, operation: op, ponto: pt, a: a, b: b })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Erro");

        salvarNoHistorico(func, op, data.result);

        document.getElementById("resultado").innerHTML = `\\[ ${data.result} \\]`;
        
        const stepsArea = document.getElementById("accordionSteps");
        stepsArea.innerHTML = "";
        (data.steps || []).forEach((s, i) => {
             stepsArea.innerHTML += `<div class="p-2 border-bottom"><small class="text-muted">Passo ${i+1}</small><div class="mt-1">\\[ ${s} \\]</div></div>`;
        });

        if (data.plot) {
          document.getElementById("btn-graph").style.display = "inline-block";
          document.getElementById("modal-graph-img").src = "data:image/png;base64," + data.plot;
        } else {
            document.getElementById("btn-graph").style.display = "none";
        }
        
        document.getElementById("result-area").style.display = "block";
        MathJax.typesetPromise();
        
      } catch (e) {
        alert("Erro: " + e.message + "\n\nVerifique se o servidor no Render está ativo.");
      } finally {
        document.getElementById("loading").style.display = "none"; 
      }
    }

    function salvarNoHistorico(f, op, res) {
        try {
            let hist = JSON.parse(localStorage.getItem('pycalc_hist') || '[]');
            hist.unshift({ date: new Date().toLocaleTimeString(), f, op, res });
            if(hist.length > 15) hist.pop();
            localStorage.setItem('pycalc_hist', JSON.stringify(hist));
            renderHist();
        } catch(e) { console.error("Histórico indisponível", e); }
    }

    function renderHist() {
        try {
            const list = document.getElementById("history-list");
            const hist = JSON.parse(localStorage.getItem('pycalc_hist') || '[]');
            if(!hist.length) { list.innerHTML = "<p class='text-center text-muted mt-3'>Vazio</p>"; return; }
            
            list.innerHTML = hist.map(item => `
                <button onclick="document.getElementById('funcao').value='${item.f}'; document.getElementById('operacao').value='${item.op}'; toggleInputs();" 
                   class="list-group-item list-group-item-action">
                   <div class="d-flex justify-content-between"><small class="fw-bold text-uppercase">${item.op}</small> <small>${item.date}</small></div>
                   <div class="text-truncate">${item.f}</div>
                </button>
            `).join('');
        } catch(e) {}
    }
    
    document.addEventListener("DOMContentLoaded", renderHist);
  </script>
</body>
</html>
